<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Referrals - InfluenceX</title>

<style>
:root {
  --primary: #ff2e63;
  --bg: #0b0b10;
  --card: #141420;
  --text: #eaeaf2;
  --muted: #9aa0b4;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: radial-gradient(circle at top, #151526, var(--bg));
  color: var(--text);
}

/* NAV */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 60px;
}

.logo {
  color: var(--primary);
  font-size: 24px;
  font-weight: 700;
}

nav a {
  color: var(--text);
  text-decoration: none;
  margin-left: 20px;
  opacity: 0.8;
}

nav a:hover {
  color: var(--primary);
}

/* DASHBOARD LAYOUT */
.container {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: calc(100vh - 80px);
}

/* SIDEBAR (SAME AS DASHBOARD) */
.sidebar {
  background: rgba(20,20,32,0.6);
  backdrop-filter: blur(10px);
  padding: 25px;
  border-right: 1px solid rgba(255,255,255,0.05);
}

.profile {
  text-align: center;
  margin-bottom: 30px;
}

.avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--primary);
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
}

.profile h3 {
  margin-top: 10px;
}

.profile p {
  font-size: 12px;
  color: var(--muted);
}

.menu button {
  width: 100%;
  background: transparent;
  border: none;
  color: var(--text);
  padding: 12px;
  text-align: left;
  cursor: pointer;
  border-radius: 10px;
  margin-bottom: 8px;
  transition: 0.3s;
}

.menu button:hover {
  background: rgba(255,46,99,0.1);
  color: var(--primary);
}

.menu button.active {
  background: rgba(255, 46, 99, 0.15);
  color: var(--primary);
  font-weight: 600;
}

/* MAIN */
.main {
  padding: 40px;
}

/* SECTIONS */
.section {
  display: none;
}

.section.active {
  display: block;
}

/* CARDS */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.card {
  background: var(--card);
  padding: 20px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.05);
}

.card h2 {
  color: var(--primary);
}

/* REF LINK BOX */
.ref-box {
  background: linear-gradient(135deg, rgba(255,46,99,0.15), rgba(20,20,32,0.8));
  padding: 25px;
  border-radius: 16px;
  border: 1px solid rgba(255,46,99,0.2);
  margin-top: 20px;
}

.ref-link {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.ref-link input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  background: #0f0f18;
  color: white;
}

button.primary {
  background: var(--primary);
  border: none;
  padding: 12px 18px;
  color: white;
  border-radius: 30px;
  cursor: pointer;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 25px;
  background: var(--card);
  border-radius: 16px;
  overflow: hidden;
}

th, td {
  padding: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

th {
  color: var(--primary);
}

.badge {
  padding: 6px 12px;
  border-radius: 20px;
  background: rgba(25,195,125,0.15);
  color: #19c37d;
  font-size: 12px;
}
</style>
</head>

<body>

<nav>
  <div class="logo">InfluenceX</div>
  <div>
    <a href="creator_dashboard.html">Dashboard</a>
    <a href="#" id="logoutBtn">Logout</a>
  </div>
</nav>

<div class="container">

  <!-- SIDEBAR (SAME STYLE AS DASHBOARD) -->
  <div class="sidebar">

    <div class="profile">
      <div class="avatar" id="avatarLetter">C</div>
      <h3 id="creatorName">Creator</h3>
      <p id="creatorEmail">loading...</p>
    </div>

    <div class="menu">

      <button onclick="window.location.href='creator_dashboard.html'">
        Dashboard
      </button>

      <button onclick="window.location.href='connect_creator_acc.html'">
        Connect Accounts
      </button>

      <button onclick="window.location.href='creator_payment.html'">
        Payments
      </button>

      <button class="active">
        Referrals
      </button>

    </div>

  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- REFERRALS SECTION -->
    <div class="section active">

      <h2 style="color:var(--primary)">Refer & Earn 🚀</h2>

      <p style="color:var(--muted); margin-top:8px;">
        Invite creators and earn rewards when they join and complete actions.
      </p>

      <!-- STATS -->
      <div class="grid" style="margin-top:25px;">

        <div class="card">
          <h2>0</h2>
          <p>Total Referrals</p>
        </div>

        <div class="card">
          <h2>₹0</h2>
          <p>Referral Earnings</p>
        </div>

        <div class="card">
          <h2>0</h2>
          <p>Active Users</p>
        </div>

      </div>

      <!-- REF LINK -->
      <div class="ref-box">

        <h2 style="color:var(--primary)">Your Referral Link</h2>

        <div class="ref-link">

          <input type="text" id="refLink" readonly>

          <button class="primary" onclick="copyLink()">
            Copy
          </button>

        </div>

      </div>

      <!-- TABLE -->
      <table>

        <tr>
          <th>User</th>
          <th>Status</th>
          <th>Reward</th>
        </tr>

        <tr>
          <td>Demo User</td>
          <td><span class="badge">Active</span></td>
          <td>₹50</td>
        </tr>

      </table>

    </div>

  </div>

</div>

<script>

// referral link
function generateLink(){
  const uid = "user123"; // later replace with Firebase UID
  document.getElementById("refLink").value =
    `https://influencex.com/signup?ref=${uid}`;
}

function copyLink(){
  const input = document.getElementById("refLink");
  input.select();
  document.execCommand("copy");
  alert("Copied!");
}

generateLink();

</script>

</body>
</html>
